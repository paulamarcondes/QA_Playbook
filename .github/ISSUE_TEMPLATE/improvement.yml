name: Practice improvement
description: Suggest a new practice, or a change to an existing one
title: "[Improvement] "
labels: ["improvement"]
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: File and section, for example 02-during-development.md, Automate strategically.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The gap or failure a team hits today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should change?
      description: The practice, section, or wording you would add.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or source
      description: Where this comes from - a real team experience, a standard, a citable reference.
